name: Pocket SDK release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "验收通过后发布 GitHub Release"
        type: boolean
        default: true
      update_existing_release:
        description: "更新已有 Release 的已验收附件（保留版本 tag）"
        type: boolean
        default: false
  push:
    tags: ["sdk-v*"]

permissions:
  contents: read

concurrency:
  group: pocket-sdk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web-engine:
    name: package-web-engine
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: web-engine-cache
        with:
          path: sdk/.pocket-build/web-engine
          key: web-engine-rust1.98.1-bun1.3.9-${{ hashFiles('sdk/native/**', 'sdk/targets/**', 'sdk/scripts/build_web_engine.ts', 'sdk/scripts/build_wechat.ts', 'sdk/scripts/build_guest.ts', 'sdk/scripts/prepare_upstream.py', 'sdk/bun.lock') }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate release version
        id: metadata
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { SDK_VERSION } from './sdk/scripts/prebuilt_tools.mjs';
          const version = JSON.parse(readFileSync('sdk/package.json', 'utf8')).version;
          if (!/^\d+\.\d+\.\d+$/.test(version) || version !== SDK_VERSION) throw new Error('SDK version mismatch');
          const tag = `sdk-v${version}`;
          if (process.env.GITHUB_REF_TYPE === 'tag' && process.env.GITHUB_REF_NAME !== tag) throw new Error(`Expected tag ${tag}`);
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ntag=${tag}\n`);
          JS
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: dtolnay/rust-toolchain@stable
        if: steps.web-engine-cache.outputs.cache-hit != 'true'
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
      - name: Install WebAssembly linker tools
        if: steps.web-engine-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm lld patch
      - name: Prepare pinned PocketJS
        if: steps.web-engine-cache.outputs.cache-hit != 'true'
        working-directory: sdk
        run: |
          python3 scripts/prepare_upstream.py
          bun install --frozen-lockfile --cwd .cache/pocketjs
      - name: Build WebAssembly engine
        if: steps.web-engine-cache.outputs.cache-hit != 'true'
        working-directory: sdk
        env:
          POCKET_WECHAT_LLVM_AR: /usr/bin/llvm-ar
        run: bun scripts/build_web_engine.ts --outdir=.pocket-build/web-engine
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-web-engine
          path: sdk/.pocket-build/web-engine
          if-no-files-found: error

  package:
    name: package-${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: web-engine
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, os: darwin, arch: arm64 }
          - { runner: windows-2022, os: win32, arch: x64 }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: pocket-web-engine
          path: sdk/.pocket-build/web-engine

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Install patch on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install patch -y --no-progress

      - name: Prepare pinned PocketJS
        working-directory: sdk
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then python scripts/prepare_upstream.py; else python3 scripts/prepare_upstream.py; fi
          bun install --frozen-lockfile --cwd .cache/pocketjs

      - name: Install SDK dependencies without install scripts
        working-directory: sdk
        run: npm install --ignore-scripts --legacy-peer-deps --no-audit --no-fund

      - name: Build Noble N-API binding
        if: runner.os != 'Windows'
        working-directory: sdk
        run: node node_modules/node-gyp/bin/node-gyp.js rebuild --directory=node_modules/@abandonware/noble

      - name: Build Noble WinRT binding
        if: runner.os == 'Windows'
        working-directory: sdk
        shell: pwsh
        run: |
          node node_modules/node-gyp/bin/node-gyp.js configure --directory=node_modules/@abandonware/noble
          if ($LASTEXITCODE -ne 0) { throw "Noble configure failed" }
          # Noble pins an old SDK in its gyp file. Use the runner's installed
          # SDK via the official MSBuild property, leaving dependency sources intact.
          $config = Get-Content node_modules/@abandonware/noble/build/config.gypi | Where-Object { $_ -notmatch '^#' } | Out-String | ConvertFrom-Json
          & $config.variables.msbuild_path node_modules/@abandonware/noble/build/binding.sln /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=10.0.26100.0 /nologo /nodeReuse:false
          if ($LASTEXITCODE -ne 0) { throw "Noble WinRT build failed" }

      - name: Build platform binaries
        if: runner.os != 'Windows'
        working-directory: sdk
        run: cargo build --locked --release --manifest-path native/Cargo.toml --bin pocket_probe --bin pocketjs_bytecode

      - name: Build Windows binaries with static CRT
        if: runner.os == 'Windows'
        working-directory: sdk
        shell: pwsh
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --locked --release --target x86_64-pc-windows-msvc --manifest-path native/Cargo.toml --bin pocket_probe --bin pocketjs_bytecode
          if ($LASTEXITCODE -ne 0) { throw "Windows native build failed" }
          New-Item -ItemType Directory -Force native/target/release | Out-Null
          Copy-Item native/target/x86_64-pc-windows-msvc/release/pocket_probe.exe native/target/release/
          Copy-Item native/target/x86_64-pc-windows-msvc/release/pocketjs_bytecode.exe native/target/release/

      - uses: subosito/flutter-action@v2
        if: runner.os == 'Windows'
        with:
          flutter-version: '3.47.9'
          channel: stable

      - name: Check pinned Flutter and build Windows FFI runtime
        if: runner.os == 'Windows'
        working-directory: sdk
        shell: pwsh
        run: |
          $pin = (Get-Content ../.fvmrc -Raw | ConvertFrom-Json).flutter
          if ($pin -ne '3.47.9') { throw "Workflow Flutter version 3.47.9 does not match .fvmrc ($pin)" }
          flutter --version
          ./scripts/build_native_windows.ps1 -SkipPrepare

      - name: Build the Flutter Windows host
        if: runner.os == 'Windows'
        working-directory: demo
        shell: pwsh
        run: |
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { throw "Flutter dependency resolution failed" }
          flutter build windows --release --no-pub
          if ($LASTEXITCODE -ne 0) { throw "Flutter Windows host build failed" }
          $nativeDll = Resolve-Path ../sdk/packages/pocket_flutter/windows/bin/pocket_flutter.dll
          $runner = Get-ChildItem build/windows -Filter pocket_host.exe -Recurse | Select-Object -First 1
          if (-not $runner) { throw "Flutter Windows runner executable was not produced" }
          $appDll = Join-Path $runner.DirectoryName 'pocket_flutter.dll'
          if (-not (Test-Path -LiteralPath $appDll -PathType Leaf)) { throw "Pocket runtime DLL was not bundled beside the Windows runner" }
          $sourceHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $nativeDll.Path).Hash
          $bundleHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $appDll).Hash
          if ($sourceHash -ne $bundleHash) { throw "Bundled Pocket runtime DLL does not match the built SDK DLL" }
          $report = [ordered]@{
            flutterVersion = (flutter --version --machine | ConvertFrom-Json).frameworkVersion
            runner = $runner.FullName
            runtimeDll = $appDll
            runtimeDllSha256 = $bundleHash
            bundledMatchesSdk = $true
          }
          New-Item -ItemType Directory -Force ../sdk/.pocket-build | Out-Null
          $report | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 ../sdk/.pocket-build/windows-flutter-acceptance.json

      - name: Verify Windows runtime dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          $dumpbin = Get-ChildItem "$vs/VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $dumpbin) { throw "dumpbin not found" }
          New-Item -ItemType Directory -Force sdk/.pocket-build | Out-Null
          $files = @("sdk/native/target/release/pocket_probe.exe", "sdk/native/target/release/pocketjs_bytecode.exe", "sdk/node_modules/@abandonware/noble/build/Release/binding.node", "sdk/packages/pocket_flutter/windows/bin/pocket_flutter.dll")
          foreach ($file in $files) {
            $deps = & $dumpbin /dependents $file
            if ($LASTEXITCODE -ne 0) { throw "Cannot inspect $file" }
            $deps | Tee-Object -FilePath sdk/.pocket-build/windows-acceptance-dependencies.txt -Append
            if ($deps -match '(?i)\b(?:VCRUNTIME|MSVCP)\d+[^\s]*\.dll') { throw "Unexpected external VC runtime dependency in $file" }
          }

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: pocket-windows-flutter-runtime
          path: |
            sdk/packages/pocket_flutter/windows/bin/pocket_flutter.dll
            sdk/.pocket-build/windows-flutter-acceptance.json
          if-no-files-found: error

      - name: Assemble npm package
        working-directory: sdk
        run: bun scripts/package_toolchain.ts --out=.pocket-build/toolchain-package --force --version=${{ needs.web-engine.outputs.version }}

      - name: Pack npm artifact
        working-directory: sdk/.pocket-build/toolchain-package
        run: npm pack --ignore-scripts

      - uses: actions/upload-artifact@v4
        with:
          name: pocket-tools-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            sdk/.pocket-build/toolchain-package/*.tgz
            sdk/.pocket-build/windows-acceptance-dependencies.txt
          if-no-files-found: error
          include-hidden-files: true

  bundle:
    name: Bundle SDK (${{ matrix.platform }})
    needs: [web-engine, package]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, platform: darwin-arm64 }
          - { runner: windows-2022, platform: win32-x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: actions/download-artifact@v4
        with:
          name: pocket-tools-${{ matrix.platform }}
          path: sdk/.pocket-build/downloaded
      - name: Assemble platform SDK and checksums
        shell: bash
        env:
          SDK_VERSION: ${{ needs.web-engine.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p release
          find sdk/.pocket-build/downloaded -name '*.tgz' -exec cp {} sdk/.pocket-build/ \;
          cp sdk/.pocket-build/pocket-tools-*.tgz release/
          find sdk/.pocket-build/downloaded -name '*dependencies.txt' -exec cp {} release/ \;
          bun sdk/scripts/export_web_sdk.ts --out=sdk/.pocket-build/release-sdk --platform="$PLATFORM"
          cd sdk/.pocket-build/release-sdk
          npm install --package-lock-only --ignore-scripts --legacy-peer-deps --no-audit --no-fund
          npm shrinkwrap --ignore-scripts
          npm pack --ignore-scripts --pack-destination ../../../release
          cd ../../../release
          test -f "pocket-web-sdk-tools-${PLATFORM}-${SDK_VERSION}.tgz"
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          import { readdirSync, readFileSync, writeFileSync } from 'node:fs';
          for (const file of readdirSync('.').filter(name => name.endsWith('.tgz'))) {
            const hash = createHash('sha256').update(readFileSync(file)).digest('hex');
            writeFileSync(`${file}.sha256`, `${hash}  ${file}\n`);
          }
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-sdk-release-${{ matrix.platform }}
          path: release/
          if-no-files-found: error

  verify:
    name: Verify final SDK (${{ matrix.os }}-${{ matrix.arch }})
    needs: [web-engine, bundle]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, os: darwin, arch: arm64 }
          - { runner: windows-2022, os: win32, arch: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: pocket-sdk-release-${{ matrix.os }}-${{ matrix.arch }}
          path: release
      - name: Install and exercise final release archive
        shell: bash
        env:
          SDK_VERSION: ${{ needs.web-engine.outputs.version }}
          PLATFORM: ${{ matrix.os }}-${{ matrix.arch }}
        run: |
          mkdir -p .pocket-build/release-consumer
          tar -xzf "release/pocket-web-sdk-tools-${PLATFORM}-${SDK_VERSION}.tgz" -C .pocket-build/release-consumer
          npm --prefix .pocket-build/release-consumer/package run setup
          npm --prefix .pocket-build/release-consumer/package run doctor
          node sdk/scripts/tests/platform_package_smoke.mjs --sdk-root=./.pocket-build/release-consumer/package | tee "release/acceptance-${PLATFORM}.json"
      - name: Preserve Studio startup diagnostics
        if: always()
        shell: bash
        run: |
          logfile=.pocket-build/release-consumer/package/.pocket-build/editor-service-8791.log
          if [ -f "$logfile" ]; then cat "$logfile"; cp "$logfile" release/studio-${{ matrix.os }}-${{ matrix.arch }}.log; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pocket-acceptance-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            release/acceptance-*.json
            release/studio-*.log
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    needs: [web-engine, bundle, verify]
    if: startsWith(github.ref, 'refs/tags/sdk-v') || inputs.publish_release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.web-engine.outputs.tag }}
      SDK_VERSION: ${{ needs.web-engine.outputs.version }}
      ALLOW_RELEASE_UPDATE: ${{ inputs.update_existing_release && '1' || '0' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pocket-sdk-release-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: pocket-acceptance-*
          path: release
          merge-multiple: true
      - name: Publish verified assets
        shell: bash
        run: |
          node <<'JS'
          const fs = require('node:fs');
          for (const platform of ['darwin-arm64', 'win32-x64']) {
            const report = JSON.parse(fs.readFileSync(`release/acceptance-${platform}.json`, 'utf8'));
            if (report.sdkVersion !== process.env.SDK_VERSION || report.platformPackage !== `@pocket/tools-${platform}` || report.nobleSourceBuildPresent !== false || !report.ok || !report.preview?.ok || !report.studio?.start || !report.studio?.health || !report.studio?.status || !report.studio?.stop) throw new Error(`Acceptance failed: ${platform}`);
            for (const template of ['app', 'game']) {
              if (!(report.builds?.[template]?.qjbcBytes > 0) || !(report.builds?.[template]?.pakBytes > 0) || !report.preview.results?.some(result => result.template === template && result.inputChangesFrame === true)) throw new Error(`Missing ${template} execution evidence: ${platform}`);
            }
          }
          JS
          cd release
          sha256sum -- *.tgz acceptance-*.json > SHA256SUMS
          cd ..
          cat > release-notes.md <<'NOTES'
          独立 Pocket Web SDK，按平台提供完整开发包（每个包只附带对应平台工具）：

          - Windows x64：`pocket-web-sdk-tools-win32-x64-VERSION.tgz`
          - macOS arm64：`pocket-web-sdk-tools-darwin-arm64-VERSION.tgz`
          - `pocket-tools-*` 是单独的编译器工具包，已有 SDK 的用户才需要单独下载。

          建议 Node.js 24 LTS（最低 22.22.2）。选择对应平台的完整 SDK 包，解压后运行：
          ```sh
          npm run setup
          npm start
          ```
          Studio 固定地址：http://127.0.0.1:8791。产品开发无需安装 Rust、Python、C/C++ 或全局 Bun。

          Release 发布前在两个平台安装完整压缩包，验证 doctor、Noble 原生模块加载、App/Game 的真实 QJBC/PAK 构建、Preview 输入驱动帧变化及 Studio 启停。验收 JSON 和 SHA256SUMS 随附件提供。

          Windows DK-META2 实机连接与 notify 尚未验收；CI 无 BLE 设备，原生模块加载测试不等于硬件连接验收。Linux 原生 BLE 暂不支持。详细说明见包内 docs/NPM_TOOLCHAIN.md 和 docs/WINDOWS_BUILD.md。
          NOTES
          sed -i "s/-VERSION\.tgz/-${SDK_VERSION}.tgz/g" release-notes.md
          printf '\n分发构建：[Action %s](https://github.com/%s/actions/runs/%s)，提交 %s。\n' "$GITHUB_RUN_ID" "$GH_REPO" "$GITHUB_RUN_ID" "$GITHUB_SHA" >> release-notes.md
          tag_commit="$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha 2>/dev/null || true)"
          if [ -n "$tag_commit" ] && [ "$tag_commit" != "$GITHUB_SHA" ] && [ "$ALLOW_RELEASE_UPDATE" != "1" ]; then
            echo "Release tag points to another commit: $tag_commit" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --json isDraft,tagName > existing-release.json 2>/dev/null; then
            node -e 'const r = require("./existing-release.json"); if ((!r.isDraft && process.env.ALLOW_RELEASE_UPDATE !== "1") || r.tagName !== process.env.RELEASE_TAG) throw new Error("Updating a published release requires update_existing_release=true")'
            gh release upload "$RELEASE_TAG" release/* --clobber
            if [ "$ALLOW_RELEASE_UPDATE" = "1" ]; then
              assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
              for obsolete in "pocket-web-sdk-tools-${SDK_VERSION}.tgz" "pocket-web-sdk-tools-${SDK_VERSION}.tgz.sha256"; do
                if printf '%s\n' "$assets" | grep -Fqx -- "$obsolete"; then gh release delete-asset "$RELEASE_TAG" "$obsolete" --yes; fi
              done
            fi
            gh release edit "$RELEASE_TAG" --title "Pocket SDK ${SDK_VERSION}" --notes-file release-notes.md
          else
            if [ "$ALLOW_RELEASE_UPDATE" = "1" ]; then echo "Release to update does not exist" >&2; exit 1; fi
            gh release create "$RELEASE_TAG" release/* --target "$GITHUB_SHA" --title "Pocket SDK ${SDK_VERSION}" --notes-file release-notes.md --draft
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest
          gh release view "$RELEASE_TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
