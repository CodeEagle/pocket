name: Pocket CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pocket-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  architecture-and-rust:
    name: architecture-and-rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify repository architecture contracts
        run: python3 sdk/scripts/check_architecture.py

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: clippy

      - name: Cache pinned PocketJS upstream
        uses: actions/cache@v4
        with:
          path: sdk/.cache/pocketjs
          key: pocketjs-upstream-${{ hashFiles('sdk/scripts/prepare_upstream.py', 'sdk/native/patches/**') }}

      - name: Cache Cargo registry and native target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            sdk/native/target
          key: cargo-native-${{ runner.os }}-1.98.1-${{ hashFiles('sdk/native/Cargo.lock', 'sdk/scripts/prepare_upstream.py', 'sdk/native/patches/**') }}
          restore-keys: |
            cargo-native-${{ runner.os }}-1.98.1-

      - name: Install system patch tool
        run: |
          sudo apt-get update
          sudo apt-get install -y patch gdb llvm

      - name: Prepare pinned PocketJS upstream
        working-directory: sdk
        run: |
          python3 scripts/prepare_upstream.py
          bun install --frozen-lockfile --cwd .cache/pocketjs

      - name: Clippy native host and worker runtime
        run: cargo clippy --locked --manifest-path sdk/native/Cargo.toml --all-targets

      - name: Diagnose native memory safety with AddressSanitizer
        id: asan-tests
        env:
          RUSTC_BOOTSTRAP: "1"
          RUSTFLAGS: "-Zsanitizer=address -Cforce-frame-pointers=yes"
          CFLAGS: "-fsanitize=address -fno-omit-frame-pointer"
          CARGO_TARGET_DIR: /tmp/pocket-native-asan
          ASAN_OPTIONS: "detect_leaks=0:abort_on_error=1:disable_coredump=0"
          ASAN_SYMBOLIZER_PATH: /usr/bin/llvm-symbolizer
          RUST_TEST_NOCAPTURE: "1"
        run: |
          ulimit -c unlimited
          sudo sysctl -w kernel.core_pattern=/tmp/pocket-native-asan-core.%p
          for attempt in $(seq 1 20); do
            echo "Native AddressSanitizer ${attempt}/20"
            timeout --signal=ABRT --kill-after=5s 120s cargo test --locked --manifest-path sdk/native/Cargo.toml --target x86_64-unknown-linux-gnu --lib
          done


      - name: Test native host and worker runtime
        id: native-tests
        shell: bash
        run: |
          ulimit -c unlimited
          sudo sysctl -w kernel.core_pattern=/tmp/pocket-native-core.%p
          timeout --signal=ABRT --kill-after=5s 60s cargo test --locked --manifest-path sdk/native/Cargo.toml
          for attempt in $(seq 1 20); do
            echo "Native parallel teardown stress ${attempt}/20"
            if ! timeout --signal=ABRT --kill-after=5s 60s cargo test --locked --manifest-path sdk/native/Cargo.toml --lib > /tmp/pocket-native-stress.log 2>&1; then
              cat /tmp/pocket-native-stress.log
              exit 1
            fi
          done

      - name: Diagnose a native test crash
        if: failure() && (steps.native-tests.outcome == 'failure' || steps.asan-tests.outcome == 'failure')
        env:
          ASAN_TEST_OUTCOME: ${{ steps.asan-tests.outcome }}
        shell: bash
        run: |
          shopt -s nullglob
          if [[ "$ASAN_TEST_OUTCOME" == failure ]]; then
            test_binary=$(find /tmp/pocket-native-asan/x86_64-unknown-linux-gnu/debug/deps -maxdepth 1 -type f -name 'pocket_flutter-*' -executable | head -1)
            cores=(/tmp/pocket-native-asan-core.*)
          else
            cargo test --locked --manifest-path sdk/native/Cargo.toml --lib --no-run --message-format=json > /tmp/native-test-build.jsonl
            test_binary=$(python3 -c 'import json; records=(json.loads(line) for line in open("/tmp/native-test-build.jsonl")); print(next(record["executable"] for record in records if record.get("executable")))')
            cores=(/tmp/pocket-native-core.*)
          fi
          if ((${#cores[@]})); then
            cat > /tmp/pocket-native-core-facts.py <<'PY'
          import gdb
          for thread in gdb.selected_inferior().threads():
              thread.switch()
              frame = gdb.newest_frame()
              while frame:
                  if frame.name() == "pocket_worker_runner_run":
                      frame.select()
                      gdb.execute("p *r")
                      gdb.execute("p r->error")
                  frame = frame.older()
          PY
            for core in "${cores[@]}"; do
              gdb --batch -ex "thread apply all bt full" -ex "source /tmp/pocket-native-core-facts.py" "$test_binary" "$core"
            done
          elif [[ "$ASAN_TEST_OUTCOME" != failure ]]; then
            timeout --signal=ABRT --kill-after=5s 60s gdb --batch -ex run -ex "thread apply all bt" --args "$test_binary"
          fi



  studio-upgrade-windows:
    name: studio-upgrade-windows
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/package-lock.json

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install pinned compiler patch dependency
        run: choco install patch -y --no-progress

      - name: Prepare pinned compiler sources for Studio imports
        shell: bash
        run: |
          python scripts/prepare_upstream.py
          bun install --frozen-lockfile --cwd .cache/pocketjs

      - name: Install SDK dependencies without install scripts
        run: npm install --ignore-scripts --legacy-peer-deps --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Verify standalone Studio upgrade on Windows
        env:
          POCKET_SOURCE_BUILD: "1"
        run: npm exec --yes --package=bun@1.4.4 -- bun test --timeout 60000 editor/test/studio_upgrade.test.ts scripts/tests/editor_service.test.ts

      - name: Preserve upgrade failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: studio-upgrade-windows-diagnostics
          path: ${{ runner.temp }}/pocket-studio-upgrade-diagnostics/
          if-no-files-found: ignore

  js-sdk-and-guest:
    name: js-sdk-and-guest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown

      - name: Cache pinned PocketJS upstream
        uses: actions/cache@v4
        with:
          path: sdk/.cache/pocketjs
          key: pocketjs-upstream-${{ hashFiles('sdk/scripts/prepare_upstream.py', 'sdk/native/patches/**') }}

      - name: Cache Cargo release binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            sdk/native/target
          key: cargo-release-${{ runner.os }}-1.98.1-${{ hashFiles('sdk/native/Cargo.lock', 'sdk/native/src/**', 'sdk/scripts/prepare_upstream.py', 'sdk/native/patches/**') }}
          restore-keys: |
            cargo-release-${{ runner.os }}-1.98.1-

      - name: Install system patch tool
        run: |
          sudo apt-get update
          sudo apt-get install -y patch llvm lld iproute2 net-tools lsof procps

      - name: Prepare pinned PocketJS upstream
        working-directory: sdk
        run: |
          python3 scripts/prepare_upstream.py
          bun install --frozen-lockfile --cwd .cache/pocketjs

      - name: Install SDK JS dependencies
        working-directory: sdk
        run: npm install --ignore-scripts --legacy-peer-deps --no-audit --no-fund

      - name: Install Chromium for browser regression tests
        working-directory: sdk
        run: npx playwright install --with-deps chromium

      - uses: actions/cache@v4
        id: web-engine-cache
        with:
          path: sdk/.pocket-build/web-engine
          key: web-engine-rust1.98.1-bun1.3.9-${{ hashFiles('sdk/native/**', '!sdk/native/target/**', 'sdk/targets/**', 'sdk/scripts/build_web_engine.ts', 'sdk/scripts/build_wechat.ts', 'sdk/scripts/build_guest.ts', 'sdk/scripts/prepare_upstream.py', 'sdk/bun.lock') }}

      - name: Build current WebAssembly engine for browser suites
        if: steps.web-engine-cache.outputs.cache-hit != 'true'
        working-directory: sdk
        env:
          POCKET_WECHAT_LLVM_AR: /usr/bin/llvm-ar
        run: bun scripts/build_web_engine.ts --outdir=.pocket-build/web-engine

      - name: Install Showcase demo JS dependencies
        working-directory: demo/js
        run: bun install --ignore-scripts

      - name: Build native probe and bytecode compiler
        run: cargo build --locked --release --manifest-path sdk/native/Cargo.toml --bin pocket_probe --bin pocketjs_bytecode

      - name: Fetch pinned official Hiyori sample resources
        uses: actions/checkout@v4
        with:
          repository: Live2D/CubismNativeSamples
          ref: b8024738f108e6003e4925193e8d5ec04cd18196
          path: sdk/.cache/cubism-native-samples
          sparse-checkout: Samples/Resources/Hiyori

      - name: Build Lantern guest from source for Flutter packaging tests
        working-directory: demo/js
        env:
          CUBISM_SDK_ROOT: ${{ github.workspace }}/sdk/.cache/cubism-native-samples
          POCKET_SOURCE_BUILD: "1"
          POCKET_COMPILER_PATH: ${{ github.workspace }}/sdk/.cache/pocketjs/tools/build.ts
          POCKET_BYTECODE_BIN: ${{ github.workspace }}/sdk/native/target/release/pocketjs_bytecode
        run: bun scripts/build_mini_apps.ts --mini-app=lantern

      - uses: actions/upload-artifact@v4
        with:
          name: lantern-guest
          path: demo/assets/apps/lantern
          if-no-files-found: error

      - name: Verify Studio upgrade lifecycle before packaging
        working-directory: sdk
        env:
          POCKET_SOURCE_BUILD: "1"
        run: npm exec --yes --package=bun@1.4.4 -- bun test --timeout 60000 editor/test/studio_upgrade.test.ts scripts/tests/editor_service.test.ts

      - name: Run SDK JS package and toolchain suites
        working-directory: sdk
        env:
          POCKET_WEB_RUNTIME: ${{ github.workspace }}/sdk/.pocket-build/web-engine/pocket-web.js
          POCKET_WEB_ENGINE: ${{ github.workspace }}/sdk/.pocket-build/web-engine/pocketjs.wasm
          POCKET_SOURCE_BUILD: "1"
          POCKET_BYTECODE_BIN: ${{ github.workspace }}/sdk/native/target/release/pocketjs_bytecode
          POCKET_NATIVE_PROBE: ${{ github.workspace }}/sdk/native/target/release/pocket_probe
        run: |
          bun scripts/test_js.ts \
            packages/pocket_ui/test \
            packages/pocket_vn/test \
            packages/pocket_spine/test \
            packages/pocket_live2d/test \
            packages/pocket_tftc/test \
            packages/pocket_diagnostics/test \
            tests \
            scripts/tests \
            editor/test/preview_text_transform.test.ts \
            editor/test/preview_recording_host_fonts.test.ts

      - name: Run Showcase guest compilation, ablation, and native probe suites
        env:
          POCKET_WEB_RUNTIME: ${{ github.workspace }}/sdk/.pocket-build/web-engine/pocket-web.js
          POCKET_WEB_ENGINE: ${{ github.workspace }}/sdk/.pocket-build/web-engine/pocketjs.wasm
          POCKET_SOURCE_BUILD: "1"
          POCKET_BYTECODE_BIN: ${{ github.workspace }}/sdk/native/target/release/pocketjs_bytecode
          POCKET_NATIVE_PROBE: ${{ github.workspace }}/sdk/native/target/release/pocket_probe
        run: bash demo/js/scripts/test_guest.sh

      - name: Preserve failed Studio upgrade diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: studio-upgrade-linux-diagnostics
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/pocket-studio-upgrade-diagnostics/**
            /tmp/pocket-e2e-real-*/.pocket-build/**/*.log
            /tmp/pocket-e2e-real-*/.pocket-build/**/*.json

  flutter-sdk-and-demo:
    name: flutter-sdk-and-demo
    runs-on: ubuntu-24.04
    needs: js-sdk-and-guest
    if: ${{ !cancelled() && needs.js-sdk-and-guest.result != 'cancelled' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: lantern-guest
          path: demo/assets/apps/lantern

      - name: Read repository Flutter pin
        id: flutter-pin
        run: python3 -c 'import json, os; open(os.environ["GITHUB_OUTPUT"], "a").write("version=" + json.load(open(".fvmrc"))["flutter"] + "\n")'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-pin.outputs.version }}
          channel: stable
          cache: true

      - name: Analyze and test pocket_services
        working-directory: sdk/packages/pocket_services
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos lib test
          flutter test

      - name: Analyze and test pocket_flutter
        working-directory: sdk/packages/pocket_flutter
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos lib test
          flutter test

      - name: Analyze and test sdk root package
        working-directory: sdk
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos lib test
          flutter test

      - name: Analyze and test Showcase demo Flutter host
        working-directory: demo
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos lib test
          flutter test
