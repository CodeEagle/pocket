name: pocket_host
description: Minimal Flutter host for a PocketJS JavaScript guest.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  pocket_sdk:
    path: ../sdk

  pocket_hardware:
    path: ../sdk/packages/pocket_hardware
  pocket_platform:
    path: ../sdk/packages/pocket_platform
  pocket_audio:
    path: ../sdk/packages/pocket_audio
  pocket_live2d:
    path: ../sdk/packages/pocket_live2d

dev_dependencies:
  pocket_permissions:
    path: ../sdk/packages/pocket_permissions
  pocket_flutter:
    path: ../sdk/packages/pocket_flutter
  pocket_services:
    path: ../sdk/packages/pocket_services
  path_provider: ^2.1.5
  path_provider_platform_interface: ^2.1.2
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  video_player: ^2.9.5
  flutter_test:
    sdk: flutter

flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true
  assets:
    - assets/app.qjbc
    - assets/app.bytecode.json
    - assets/guest-manifest.json
    - assets/app.pak
    - assets/videos/
    - assets/apps/profile/
    - assets/apps/lobby/
    - assets/apps/lantern/
    - assets/apps/lantern/audio/
    - assets/apps/lantern/videos/
    - assets/apps/lantern/native-models/
    - assets/apps/official/
    # BEGIN GENERATED OFFICIAL DEMO ASSETS
    - assets/apps/official/catalog.json
    - assets/apps/official/blackberry-classic-demo/
    - assets/apps/official/cafe/
    - assets/apps/official/cards/
    - assets/apps/official/chrome/
    - assets/apps/official/clear/
    - assets/apps/official/companion-zero/
    - assets/apps/official/cursor/
    - assets/apps/official/devkit/
    - assets/apps/official/gallery/
    - assets/apps/official/gba-hero/
    - assets/apps/official/hero/
    - assets/apps/official/im/
    - assets/apps/official/iphone16-demo/
    - assets/apps/official/iphone2g-demo/
    - assets/apps/official/iphone4s-demo/
    - assets/apps/official/ipodnano-hero/
    - assets/apps/official/ipodtouch-demo/
