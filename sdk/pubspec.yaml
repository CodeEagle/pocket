name: pocket_sdk
description: Embeddable PocketJS bytecode host, updates and native capability integration for Flutter apps.
version: 0.1.0
publish_to: none
environment:
  sdk: ^3.9.2
  flutter: '>=3.35.0'
dependencies:
  crypto: ^3.0.6
  flutter:
    sdk: flutter
  pocket_flutter:
    path: packages/pocket_flutter
  pocket_archive:
    path: packages/pocket_archive
  pocket_diagnostics:
    path: packages/pocket_diagnostics
  pocket_services:
    path: packages/pocket_services
  package_info_plus: 8.3.0
  path_provider: ^2.1.5
dev_dependencies:
  cryptography: ^2.7.0
  flutter_lints: ^5.0.0
  test: ^1.25.8
  flutter_test:
    sdk: flutter
