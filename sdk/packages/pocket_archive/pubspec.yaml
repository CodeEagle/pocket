name: pocket_archive
description: Native ZIP and 7z extraction for Pocket Flutter hosts.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.2
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.pocketjs.pocket_archive
        pluginClass: PocketArchivePlugin
      ios:
        pluginClass: PocketArchivePlugin
      macos:
        pluginClass: PocketArchivePlugin
