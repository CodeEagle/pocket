name: pocket_platform
description: Thin trusted PocketJS platform experience provider for Flutter hosts.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.2
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  pocket_services:
    path: ../pocket_services

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: dev.pocketjs.pocket_platform
        pluginClass: PocketPlatformPlugin
      ios:
        pluginClass: PocketPlatformPlugin
