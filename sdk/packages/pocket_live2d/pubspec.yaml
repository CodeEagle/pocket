name: pocket_live2d
description: Thin cross-platform Cubism Core deformation provider for PocketJS.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.2
  flutter: '>=3.35.0'

dependencies:
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  pocket_services:
    path: ../pocket_services

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  pocket_flutter:
    path: ../pocket_flutter
  pocket_sdk:
    path: ../..

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
