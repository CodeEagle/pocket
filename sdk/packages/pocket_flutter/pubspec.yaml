name: pocket_flutter
description: Minimal PocketJS retained Canvas renderer and QuickJS FFI bridge.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.2
  flutter: '>=3.35.0'

dependencies:
  ffi: ^2.1.3
  flutter:
    sdk: flutter
  video_player: ^2.9.5

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  video_player_platform_interface: ^6.7.0

flutter:
  shaders:
    - shaders/liquid_glass.frag
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        pluginClass: PocketFlutterPlugin
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
