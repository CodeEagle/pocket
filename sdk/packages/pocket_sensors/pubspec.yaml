name: pocket_sensors
description: Independently selectable PocketJS sensors capability provider.
version: 0.1.0
publish_to: none
environment:
  sdk: ^3.9.2
  flutter: '>=3.35.0'
dependencies:
  pocket_hardware_core:
    path: ../pocket_hardware_core
flutter:
  plugin:
    platforms:
      android:
        package: dev.pocketjs.pocket_sensors
        pluginClass: PocketSensorsPlugin
      ios:
        pluginClass: PocketSensorsPlugin
