name: pocket_hardware
description: Compiled-in PocketJS hardware capability provider for Flutter hosts.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.2
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  pocket_services:
    path: ../pocket_services
  pocket_flutter:
    path: ../pocket_flutter
  pocket_permissions:
    path: ../pocket_permissions
  pocket_hardware_core:
    path: ../pocket_hardware_core
  pocket_camera:
    path: ../pocket_camera
  pocket_bluetooth:
    path: ../pocket_bluetooth
  pocket_sensors:
    path: ../pocket_sensors
  pocket_location:
    path: ../pocket_location
  pocket_biometrics:
    path: ../pocket_biometrics
  pocket_weather:
    path: ../pocket_weather

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
